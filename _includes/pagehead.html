<section class="pagehead"><div class="wrap">
  <div class="crumbs"><a href="{{ '/' | relative_url }}">Home</a><span aria-hidden="true">/</span>{% if include.parent %}<a href="{{ include.parent_url | relative_url }}">{{ include.parent }}</a><span aria-hidden="true">/</span>{% endif %}<span>{{ include.crumb | default: page.title }}</span></div>
  {% if include.eyebrow %}<p class="eyebrow" style="margin-top:14px">{{ include.eyebrow }}</p>{% endif %}
  <h1>{{ include.title | default: page.title }}</h1>
  {% if include.lede %}<p>{{ include.lede }}</p>{% endif %}
</div></section>
