<script>
document.getElementById("menuBtn").addEventListener("click",function(){var n=document.getElementById("mainNav");var o=n.classList.toggle("open");this.setAttribute("aria-expanded",o)});
document.addEventListener("click",function(ev){var b=ev.target.closest(".copy");if(!b)return;var t=b.getAttribute("data-copy");function sel(){var v=b.parentElement.querySelector(".val");var r=document.createRange();r.selectNodeContents(v);var s=getSelection();s.removeAllRanges();s.addRange(r)}try{navigator.clipboard.writeText(t).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy address"},1600)},sel)}catch(e){sel()}});
</script>
